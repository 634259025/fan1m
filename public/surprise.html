<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Surprise for You 💖</title>

  <!-- Tailwind CDN (สำหรับโปรโตไทป์) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- canvas-confetti (สำหรับคอนเฟตติ) -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    /* floating hearts */
    .heart {
      position: absolute;
      width: 36px;
      height: 36px;
      transform: rotate(-45deg);
      left: 50%;
      top: 50%;
      pointer-events: none;
      animation: floatUp linear forwards;
      opacity: 0.9;
    }
    .heart:before,
    .heart:after {
      content: "";
      position: absolute;
      width: 36px;
      height: 36px;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.35), transparent 30%), linear-gradient(135deg,#ff6b9a,#ff3d7f);
      border-radius: 50%;
    }
    .heart:before {
      top: -18px;
      left: 0;
    }
    .heart:after {
      left: 18px;
      top: 0;
    }
    @keyframes floatUp {
      from { transform: translate(-50%, 0) scale(0.6) rotate(-45deg); opacity: 1; }
      to { transform: translate(-50%, -380px) scale(1) rotate(-45deg); opacity: 0; }
    }

    /* nice blur behind modal */
    .glass {
      backdrop-filter: blur(6px) saturate(110%);
      background-color: rgba(255,255,255,0.45);
    }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-b from-pink-50 via-white to-indigo-50 font-sans flex items-center justify-center p-6">

  <!-- 並置 container -->
  <div class="w-full max-w-4xl mx-auto">

    <!-- Header / card -->
    <div class="bg-white rounded-3xl shadow-2xl p-8 relative overflow-hidden">
      <div class="flex items-start justify-between gap-4">
        <div>
          <h1 class="text-3xl md:text-4xl font-extrabold text-rose-600">For You, my love 💖</h1>
          <p class="mt-2 text-slate-600">กดปุ่มด้านล่างเพื่อรับเซอร์ไพรส์นะ 😉</p>
        </div>

        <div class="text-right">
          <button id="openBtn" class="px-4 py-2 bg-rose-500 hover:bg-rose-400 text-white rounded-lg shadow">Surprise!</button>
        </div>
      </div>

      <!-- slideshow -->
      <div class="mt-6 grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="col-span-2 rounded-xl overflow-hidden">
          <div id="slide" class="h-64 bg-center bg-cover rounded-xl shadow-md"></div>
        </div>
        <div class="rounded-xl p-4 glass">
          <h3 class="font-semibold text-slate-700">รักนะ</h3>
          <p class="mt-3 text-slate-600" id="shortText">ฉันทำเว็บเซอร์ไพรส์นี้ให้คุณ — หวังว่าจะชอบนะ</p>

          <div class="mt-4">
            <input id="nameInput" placeholder="พิมพ์ชื่อที่นี่ (เช่น น้องสมอย)" class="w-full p-2 rounded-lg border" />
            <button id="saveName" class="mt-3 w-full px-3 py-2 bg-indigo-600 text-white rounded-lg">บันทึกชื่อ</button>
          </div>
        </div>
      </div>

      <div class="mt-6 flex items-center gap-3 text-sm text-slate-500">
        <svg class="w-5 h-5 text-rose-400" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-6.716-4.35-9.538-7.14C-.401 10.874 2.22 3.75 7.5 4.75c2.405.5 3.5 2.21 4.5 3.5 1-1.29 2.095-3.0 4.5-3.5 5.28-1.0 7.901 6.124 4.038 9.11C18.716 16.65 12 21 12 21z"/></svg>
        ทำโดยคนที่รักคุณมาก
      </div>
    </div>

    <!-- footer small -->
    <div class="mt-6 text-center text-slate-500">เปิดแล้วกด <strong>Surprise!</strong> เพื่อเริ่ม</div>
  </div>

  <!-- Modal overlay -->
  <div id="modal" class="fixed inset-0 flex items-center justify-center z-50 hidden">
    <div class="absolute inset-0 bg-black/50"></div>
    <div class="relative bg-white rounded-3xl p-6 w-full max-w-xl shadow-2xl text-center">
      <h2 id="modalTitle" class="text-2xl font-bold text-rose-600">เซอร์ไพรส์!</h2>
      <p id="modalMessage" class="mt-3 text-slate-600">นี่คือข้อความพิเศษสำหรับคุณ</p>

      <div class="mt-6">
        <button id="playMore" class="px-5 py-2 bg-rose-500 text-white rounded-lg">ฟังเพลง & ดูต่อ</button>
        <button id="closeModal" class="ml-3 px-4 py-2 border rounded-lg">ปิด</button>
      </div>
    </div>
  </div>

  <!-- audio element (ใส่ไฟล์ music.mp3 ใน public/assets/) -->
  <audio id="bgMusic" src="/assets/music.mp3" preload="auto"></audio>

  <script>
    // ----- config -----
    const photos = [
      '/assets/photos/1.jpg',
      '/assets/photos/2.jpg',
      '/assets/photos/3.jpg'
    ]; // ถ้าไม่มีรูป ให้เอาออกหรือใส่รูปจริง

    const messages = [
      "รักคุณเสมอ 💕",
      "ขอบคุณที่อยู่ข้างๆ กันเสมอ",
      "มีความสุขมากๆ นะวันนี้"
    ];

    // ----- slideshow -----
    const slide = document.getElementById('slide');
    let idx = 0;
    function showSlide(i) {
      if (photos.length === 0) {
        slide.style.background = 'linear-gradient(135deg,#ffe5f0,#fff1f6)';
        slide.innerHTML = '<div class="p-6">ไม่มีรูปภาพ</div>';
        return;
      }
      const url = photos[i % photos.length];
      slide.style.backgroundImage = `url('${url}')`;
      slide.style.backgroundSize = 'cover';
      slide.style.backgroundPosition = 'center';
    }
    showSlide(0);
    setInterval(() => {
      idx = (idx + 1) % (photos.length || 1);
      showSlide(idx);
    }, 4000);

    // ----- floating hearts -----
    function makeHeart() {
      const heart = document.createElement('div');
      heart.className = 'heart';
      // random left position
      const left = Math.random() * 80 + 10; // 10% - 90%
      heart.style.left = left + '%';
      heart.style.top = '85%';
      // random size & duration
      const size = Math.random() * 24 + 24; // 24 - 48
      heart.style.width = size + 'px';
      heart.style.height = size + 'px';
      heart.style.animationDuration = (3 + Math.random() * 2) + 's';
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 6000);
    }

    // small hearts appear periodically (but not too many)
    let heartTimer = setInterval(makeHeart, 900);

    // ----- confetti helper -----
    function bigConfetti() {
      // burst
      confetti({
        particleCount: 120,
        spread: 120,
        origin: { y: 0.6 }
      });
      confetti({
        particleCount: 60,
        spread: 60,
        origin: { y: 0.6 }
      });
    }

    // ----- modal & buttons -----
    const openBtn = document.getElementById('openBtn');
    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modalTitle');
    const modalMessage = document.getElementById('modalMessage');
    const closeModal = document.getElementById('closeModal');
    const playMore = document.getElementById('playMore');
    const bgMusic = document.getElementById('bgMusic');

    function openModal() {
      // pick a sweet message
      const m = messages[Math.floor(Math.random()*messages.length)];
      modalTitle.textContent = 'เซอร์ไพรส์สำหรับคุณ 🎉';
      modalMessage.textContent = m;
      modal.classList.remove('hidden');
      // big confetti
      bigConfetti();
      // make a few hearts fast
      for (let i=0;i<6;i++) setTimeout(makeHeart, i*180);
    }

    openBtn.addEventListener('click', () => {
      openModal();
      // autoplay music if exists (note: many browsers block autoplay unless user interacted)
      // we already have a user click, so it's fine.
      if (bgMusic && bgMusic.src) {
        bgMusic.currentTime = 0;
        bgMusic.play().catch(()=>{ /* ignore */ });
      }
    });

    closeModal.addEventListener('click', () => {
      modal.classList.add('hidden');
      // small confetti on close
      confetti({ particleCount: 40, spread: 90, origin: { y: 0.6 }});
    });

    playMore.addEventListener('click', () => {
      // bigger celebration
      bigConfetti();
      // show longer message sequence
      showFullSequence();
    });

    // ----- personalization (name) -----
    document.getElementById('saveName').addEventListener('click', () => {
      const v = document.getElementById('nameInput').value.trim();
      if (v) {
        document.getElementById('shortText').textContent = `สำหรับ ${v} — คุณสุดยอดมาก ❤️`;
        // send to server (optional)
        fetch('/api/save-message', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: v, timestamp: new Date().toISOString() })
        }).catch(()=>{});
      } else {
        alert('กรุณาพิมพ์ชื่อก่อนบันทึก');
      }
    });

    // ----- full sequence: messages + extra confetti -----
    function showFullSequence() {
      // sequence of messages shown in modal
      const seq = [
        "วันนี้อยากให้คุณยิ้ม :)",
        "ขอบคุณที่อยู่ด้วยกันเสมอ",
        "คุณคือคนที่ทำให้ชีวิตเติมเต็ม 💖"
      ];
      let i = 0;
      modalMessage.textContent = seq[i];
      const iv = setInterval(() => {
        i++;
        if (i < seq.length) {
          modalMessage.textContent = seq[i];
          confetti({ particleCount: 30, spread: 80, origin: { y: 0.6 }});
        } else {
          clearInterval(iv);
          // final confetti
          bigConfetti();
        }
      }, 2200);
    }

    // Accessibility: allow closing modal with ESC
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') modal.classList.add('hidden');
    });

    // If you want to mute/unmute via click on slide
    slide.addEventListener('click', () => {
      if (!bgMusic) return;
      if (bgMusic.paused) bgMusic.play().catch(()=>{});
      else bgMusic.pause();
    });

    // If music file missing, don't crash — simply hide audio
    bgMusic.addEventListener('error', () => {
      console.warn('bgMusic not found at /assets/music.mp3 — ถ้าอยากให้มีเพลง ให้ใส่ไฟล์ใน public/assets/music.mp3');
    });

    // clean up hearts on page hide/unload
    window.addEventListener('beforeunload', () => {
      clearInterval(heartTimer);
    });

  </script>
</body>
</html>
